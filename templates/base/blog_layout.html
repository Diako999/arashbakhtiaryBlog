{% extends "base/layout.html" %}
{% load i18n %}

{% block content %}
<div class="grid gap-8 lg:grid-cols-[2fr_1fr]">
  <div>{% block blog_content %}{% endblock %}</div>
  <aside class="flex flex-col gap-6">
    {% block sidebar %}
      <div>
        <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">
          {% trans "Categories" %}
        </h2>
        <ul class="flex flex-col gap-1">
          {% for category in categories %}
            <li>
              <a href="{% url 'blog:list_by_category' category.slug %}"
                 class="text-sm hover:underline {% if category.slug == current_category %}font-bold{% endif %}">
                {{ category.name }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    {% endblock %}
  </aside>
</div>
{% endblock %}
