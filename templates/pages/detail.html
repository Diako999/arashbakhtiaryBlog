{% extends "base/layout.html" %}

{% block title %}{{ page.title }} · {{ site_settings.site_name }}{% endblock %}

{% block content %}
<article class="mx-auto flex max-w-2xl flex-col gap-4">
  <h1 class="text-2xl font-bold sm:text-3xl">{{ page.title }}</h1>
  <div class="prose max-w-none dark:prose-invert">
    {{ page.body|safe }}
  </div>
</article>
{% endblock %}
