{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="lang-switcher-form">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.path }}">
  <select name="language"
          class="cursor-pointer rounded-full border border-line bg-card px-3.5 py-1.5 text-[13px] font-semibold text-ink transition-colors hover:border-brand"
          onchange="this.form.submit()">
    {% get_current_language as CURRENT_LANGUAGE %}
    {% get_available_languages as AVAILABLE_LANGUAGES %}
    {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
      <option value="{{ lang_code }}" {% if lang_code == CURRENT_LANGUAGE %}selected{% endif %}>{{ lang_name }}</option>
    {% endfor %}
  </select>
</form>
