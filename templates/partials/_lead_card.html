{% load i18n %}
<a href="{{ lead_magnet.get_absolute_url }}"
   class="group flex h-full flex-col overflow-hidden rounded-[18px] border border-line bg-card text-ink no-underline shadow-[0_1px_3px_rgba(0,0,0,.25)] transition-all duration-300 ease-[cubic-bezier(.2,.8,.2,1)] hover:-translate-y-1.5 hover:border-brand hover:shadow-[0_20px_40px_-14px_rgba(0,0,0,.5)]">
  <div class="relative aspect-[16/9] w-full shrink-0 overflow-hidden bg-gradient-to-br from-brand to-accent">
    {% if lead_magnet.cover_image %}
      <img src="{{ lead_magnet.cover_image.url }}" alt="{{ lead_magnet.title }}" class="h-full w-full object-cover">
    {% else %}
      <span class="absolute inset-0 flex items-center justify-center text-[13px] font-semibold text-white/65">
        {% trans "Resource cover image" %}
      </span>
    {% endif %}
  </div>
  <div class="flex flex-1 flex-col gap-2.5 px-5 pb-6 pt-5">
    <h3 class="m-0 text-[19px] font-bold leading-[1.5]">{{ lead_magnet.title }}</h3>
    {% if lead_magnet.description %}
      <p class="m-0 flex-1 text-[14.5px] leading-[1.9] text-ink-muted">{{ lead_magnet.description|truncatewords:20 }}</p>
    {% endif %}
    <span class="mt-1 flex items-center gap-1 text-[13.5px] font-semibold text-brand transition-[gap] duration-200 group-hover:gap-2">
      {% trans "Get it for free" %} ←
    </span>
  </div>
</a>
