{% load i18n %}
<article class="flex flex-col gap-2 border-b border-gray-100 pb-6 dark:border-gray-800 sm:flex-row sm:gap-4">
  {% if post.cover_image %}
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}"
         class="h-40 w-full rounded-md object-cover sm:h-28 sm:w-40 sm:shrink-0">
  {% endif %}
  <div class="flex flex-col gap-1">
    <h2 class="text-lg font-semibold">
      <a href="{{ post.get_absolute_url }}" class="hover:underline">{{ post.title }}</a>
    </h2>
    {% if post.excerpt %}
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ post.excerpt }}</p>
    {% endif %}
    <div class="flex flex-wrap gap-2 text-xs text-gray-400">
      {% if post.category %}
        <a href="{{ post.category.get_absolute_url }}" class="hover:underline">{{ post.category.name }}</a>
      {% endif %}
      {% if post.published_at %}
        <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"SHORT_DATE_FORMAT" }}</time>
      {% endif %}
    </div>
  </div>
</article>
