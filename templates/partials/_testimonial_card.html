<figure class="flex h-full flex-col gap-[18px] rounded-[18px] border border-line bg-card p-[26px] shadow-[0_1px_3px_rgba(0,0,0,.25)] transition-all duration-300 ease-[cubic-bezier(.2,.8,.2,1)] hover:-translate-y-1.5 hover:border-brand hover:shadow-[0_20px_40px_-14px_rgba(0,0,0,.5)]">
  <svg width="30" height="24" viewBox="0 0 30 24" fill="none" class="opacity-50">
    <path d="M12.6 0C6.3 3.2 2.4 8.4 2.4 14.8C2.4 20 5.6 24 10 24C13.6 24 16.4 21.2 16.4 17.6C16.4 14 13.8 11.4 10.4 11.4C9.8 11.4 9.2 11.4 8.8 11.6C9.4 7.6 12.4 4 16.6 2L12.6 0ZM26.2 0C19.9 3.2 16 8.4 16 14.8C16 20 19.2 24 23.6 24C27.2 24 30 21.2 30 17.6C30 14 27.4 11.4 24 11.4C23.4 11.4 22.8 11.4 22.4 11.6C23 7.6 26 4 30.2 2L26.2 0Z" fill="var(--brand)"/>
  </svg>
  <blockquote class="m-0 flex-1 text-[15.5px] leading-[2] text-ink">{{ testimonial.quote }}</blockquote>
  <figcaption class="flex items-center gap-3 border-t border-line pt-3.5">
    {% if testimonial.photo %}
      <img src="{{ testimonial.photo.url }}" alt="{{ testimonial.author_name }}" class="h-11 w-11 shrink-0 rounded-full object-cover">
    {% else %}
      <span class="h-11 w-11 shrink-0 rounded-full bg-gradient-to-br from-brand to-accent"></span>
    {% endif %}
    <div class="flex flex-col gap-0.5">
      <span class="text-[14.5px] font-bold text-ink">{{ testimonial.author_name }}</span>
      {% if testimonial.author_role %}
        <span class="text-[13px] text-ink-muted">{{ testimonial.author_role }}</span>
      {% endif %}
    </div>
  </figcaption>
</figure>
