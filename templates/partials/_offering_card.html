{% load i18n %}
<a href="{{ offering.get_absolute_url }}"
   class="group flex h-full flex-col overflow-hidden rounded-[18px] border border-line bg-card text-ink no-underline shadow-[0_1px_3px_rgba(0,0,0,.25)] transition-all duration-300 ease-[cubic-bezier(.2,.8,.2,1)] hover:-translate-y-1.5 hover:border-brand hover:shadow-[0_20px_40px_-14px_rgba(0,0,0,.5)]">
  <div class="relative aspect-[16/9] w-full shrink-0 overflow-hidden bg-gradient-to-br from-accent to-brand">
    {% if offering.cover_image %}
      <img src="{{ offering.cover_image.url }}" alt="{{ offering.title }}" class="h-full w-full object-cover">
    {% else %}
      <span class="absolute inset-0 flex items-center justify-center text-[13px] font-semibold text-white/65">
        {% trans "Course cover image" %}
      </span>
    {% endif %}
  </div>
  <div class="flex flex-1 flex-col gap-3 px-5 pb-6 pt-5">
    <h3 class="m-0 text-[19px] font-bold leading-[1.5]">{{ offering.title }}</h3>
    {% if offering.summary %}
      <p class="m-0 flex-1 text-[14.5px] leading-[1.9] text-ink-muted">{{ offering.summary }}</p>
    {% endif %}
    <div class="mt-1 flex items-center justify-between border-t border-line pt-3.5">
      <span class="text-[16px] font-bold text-brand">
        {% if offering.price %}{{ offering.price }}{% else %}{% trans "Free" %}{% endif %}
      </span>
      <span class="flex items-center gap-1 text-[13.5px] font-semibold text-ink transition-[gap] duration-200 group-hover:gap-2">
        {% trans "View course" %} ←
      </span>
    </div>
  </div>
</a>
