{% for item in nav_items %}
  {% if item.children.all %}
    <div class="group relative">
      <button type="button" class="flex items-center gap-1 text-sm font-medium hover:text-[var(--accent,inherit)]">
        {{ item.title }}
      </button>
      <div class="absolute start-0 top-full hidden min-w-40 flex-col rounded-md border border-gray-200 bg-white py-1 shadow-lg group-hover:flex dark:border-gray-800 dark:bg-gray-900">
        {% for child in item.children.all %}
          <a href="{{ child.get_url }}" class="px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-800">{{ child.title }}</a>
        {% endfor %}
      </div>
    </div>
  {% else %}
    <a href="{{ item.get_url }}" class="text-sm font-medium hover:text-[var(--accent,inherit)]">
      {{ item.title }}
    </a>
  {% endif %}
{% endfor %}
